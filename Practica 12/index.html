<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificador de Dígitos</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

body{
    font-family: "Segoe UI", sans-serif;
    text-align:center;
    background:#e9eef5;
    padding:40px;
}

h1{
    color:#222;
}

.descripcion{
    color:#666;
    margin-bottom:15px;
}

#zonaDibujo{
    border:3px solid #444;
    background:white;
    cursor:crosshair;
    touch-action:none;
    margin-top:20px;
}

.contenedorBotones{
    margin-top:22px;
}

button{
    padding:11px 20px;
    margin:0 10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#salida{
    margin-top:25px;
    font-size:26px;
    font-weight:bold;
    color:#0f766e;
}

#previewMini{
    margin-top:20px;
    border:1px solid #777;
    image-rendering:pixelated;
    width:140px;
    height:140px;
    background:white;
}

</style>
</head>

<body>

<h1>Detector de Números</h1>
<p class="descripcion">Dibuja un dígito del 0 al 9 y presiona analizar</p>

<canvas id="zonaDibujo" width="280" height="280"></canvas>

<div class="contenedorBotones">
<button onclick="resetCanvas()">Borrar</button>
<button onclick="analizarNumero()">Analizar</button>
</div>

<div>
<h3>Escala 28x28</h3>
<canvas id="previewMini" width="28" height="28"></canvas>
</div>

<div id="salida">Resultado: -</div>

<script>

const area = document.getElementById("zonaDibujo");
const contexto = area.getContext("2d");

const preview = document.getElementById("previewMini");
const previewCTX = preview.getContext("2d");

let estaDibujando = false;

/* Fondo inicial blanco */
contexto.fillStyle="white";
contexto.fillRect(0,0,area.width,area.height);

/* Configuración del trazo */
contexto.strokeStyle="black";
contexto.lineWidth=18;
contexto.lineCap="round";
contexto.lineJoin="round";

function obtenerCoord(evento){
    const rect = area.getBoundingClientRect();
    return {
        x:evento.clientX - rect.left,
        y:evento.clientY - rect.top
    };
}

area.addEventListener("mousedown",e=>{
    estaDibujando=true;
    const p=obtenerCoord(e);
    contexto.beginPath();
    contexto.moveTo(p.x,p.y);
});

area.addEventListener("mousemove",e=>{
    if(!estaDibujando) return;
    const p=obtenerCoord(e);
    contexto.lineTo(p.x,p.y);
    contexto.stroke();
});

area.addEventListener("mouseup",()=>{
    estaDibujando=false;
    contexto.beginPath();
});

area.addEventListener("mouseleave",()=>{
    estaDibujando=false;
    contexto.beginPath();
});

/* soporte para pantalla táctil */

area.addEventListener("touchstart",e=>{
    e.preventDefault();
    estaDibujando=true;

    const touch=e.touches[0];
    const rect=area.getBoundingClientRect();

    const x=touch.clientX-rect.left;
    const y=touch.clientY-rect.top;

    contexto.beginPath();
    contexto.moveTo(x,y);
});

area.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(!estaDibujando) return;

    const touch=e.touches[0];
    const rect=area.getBoundingClientRect();

    const x=touch.clientX-rect.left;
    const y=touch.clientY-rect.top;

    contexto.lineTo(x,y);
    contexto.stroke();
});

area.addEventListener("touchend",e=>{
    e.preventDefault();
    estaDibujando=false;
    contexto.beginPath();
});


function resetCanvas(){

    contexto.clearRect(0,0,area.width,area.height);
    contexto.fillStyle="white";
    contexto.fillRect(0,0,area.width,area.height);

    previewCTX.clearRect(0,0,28,28);
    previewCTX.fillStyle="white";
    previewCTX.fillRect(0,0,28,28);

    document.getElementById("salida").innerHTML="Resultado: -";
}


function generarPixeles(){

    previewCTX.clearRect(0,0,28,28);
    previewCTX.fillStyle="white";
    previewCTX.fillRect(0,0,28,28);

    previewCTX.drawImage(area,0,0,28,28);

    const arregloPixeles=[];

    for(let fila=0; fila<28; fila++){
        for(let col=0; col<28; col++){

            const pixel=previewCTX.getImageData(col,fila,1,1).data;

            let valor=1-(pixel[0]/255);

            valor=Number(valor.toFixed(2));

            arregloPixeles.push(valor);
        }
    }

    return arregloPixeles;
}


function analizarNumero(){

    const datos=generarPixeles();

    $.post(
        "http://localhost:8000",
        {pixeles:datos.join(",")},
        function(resp){
            console.log("Predicción:",resp);
            $("#salida").html("Resultado: "+resp);
        }
    ).fail(function(err){
        console.error(err.responseText);
        $("#salida").html("Error: "+err.responseText);
    });

}

</script>

</body>
</html>
